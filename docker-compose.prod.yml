# Прод-override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: ./backend
      target: prod
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      SEED_ON_START: "false"
    volumes: []
    ports: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  frontend:
    build:
      context: ./frontend
      target: prod
    environment: {}
    volumes: []
    ports:
      - "80:80"
    command: ["nginx", "-g", "daemon off;"]
